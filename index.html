<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trus Tamah — Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ─── THEME TOGGLE ─────────────────────────── -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span class="theme-icon">🌙</span>
  </button>

  <div class="app-wrapper">

    <!-- ─── HERO / GREETING SECTION ──────────────── -->
    <section class="hero-card card">
      <div class="profile-area">
        <div class="avatar" id="avatarBtn" title="Click to change photo" role="button" tabindex="0" aria-label="Change profile photo">
          <img class="avatar-photo hidden" id="avatarPhoto" alt="Profile photo" />
          <span class="avatar-initials" id="avatarInitials">TT</span>
          <div class="avatar-overlay">
            <span class="avatar-overlay-icon">📷</span>
          </div>
        </div>
        <!-- Hidden file input -->
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none" aria-label="Upload profile photo" />
        <div class="profile-meta">
          <p class="profile-label">welcome back,</p>
          <h1 class="profile-name" id="displayName">Your Name</h1>
          <button class="btn-ghost btn-sm" id="editNameBtn">✏️ edit name</button>
        </div>
      </div>

      <!-- Name edit modal -->
      <div class="name-modal hidden" id="nameModal">
        <div class="name-modal-inner">
          <p class="modal-label">Change your name</p>
          <input type="text" id="nameInput" class="input-field" placeholder="Your name…" maxlength="32" />
          <div class="modal-actions">
            <button class="btn-ghost" id="cancelNameBtn">Cancel</button>
            <button class="btn-primary" id="saveNameBtn">Save</button>
          </div>
        </div>
      </div>

      <div class="time-area">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-str" id="dateStr">—</div>
        <div class="greeting-badge" id="greeting">Good Morning ✨</div>
      </div>
    </section>

    <!-- ─── MAIN GRID ──────────────────────────── -->
    <div class="main-grid">

      <!-- ── FOCUS TIMER ──────────────────────── -->
      <section class="card timer-card">
        <div class="card-header">
          <h2 class="card-title">Focus Timer</h2>
          <div class="pomodoro-settings">
            <label class="setting-label">mins</label>
            <input type="number" id="pomodoroInput" class="input-mini" value="25" min="1" max="120" />
            <button class="btn-ghost btn-sm" id="setPomodoroBtn">Set</button>
          </div>
        </div>

        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-progress-wrap">
          <div class="timer-progress-bar" id="timerProgress"></div>
        </div>

        <div class="timer-controls">
          <button class="btn-primary" id="startBtn">▶ Start</button>
          <button class="btn-secondary" id="pauseBtn">⏸ Pause</button>
          <button class="btn-ghost" id="resetBtn">↺ Reset</button>
        </div>

        <p class="timer-status" id="timerStatus">Ready to focus</p>
      </section>

      <!-- ── TO-DO LIST ────────────────────────── -->
      <section class="card todo-card">
        <div class="card-header">
          <h2 class="card-title">Tasks</h2>
          <div class="todo-controls">
            <select class="input-select" id="sortSelect">
              <option value="default">Default</option>
              <option value="az">A → Z</option>
              <option value="za">Z → A</option>
              <option value="done">Done last</option>
            </select>
          </div>
        </div>

        <div class="todo-input-row">
          <input type="text" id="taskInput" class="input-field" placeholder="Add a new task…" maxlength="80" />
          <button class="btn-primary" id="addTaskBtn">Add</button>
        </div>
        <p class="duplicate-msg hidden" id="duplicateMsg">⚠️ Task already exists!</p>

        <ul class="task-list" id="taskList"></ul>
        <p class="empty-state hidden" id="emptyState">No tasks yet — add one above 🎯</p>
      </section>

    </div><!-- /main-grid -->

    <!-- ─── QUICK LINKS ───────────────────────── -->
    <section class="card links-card">
      <div class="card-header">
        <h2 class="card-title">Quick Links</h2>
      </div>
      <div class="links-input-row">
        <input type="text" id="linkName" class="input-field" placeholder="Name" maxlength="24" />
        <input type="url"  id="linkUrl"  class="input-field" placeholder="https://…" />
        <button class="btn-primary" id="addLinkBtn">Add Link</button>
      </div>
      <div class="links-grid" id="linksGrid"></div>
    </section>

  </div><!-- /app-wrapper -->

  <script src="js/app.js"></script>
</body>
</html>
